if(directTK) {intro.state.phase='done';introUI.update();loadLevel(2);startCurrentLevel(now());if(roverPreview)setTimeout(pollPreview,0);}
addEventListener('blur', () => { for (const code of Object.keys(keys)) keys[code] = false; });
(function frame() {
  const t = now(), dt = Math.min(0.05, Math.max(0, t - last)); last = t;
  if (intro.state.phase !== 'done') {
    // Freeze all gameplay: only the cinematic/tutorial clock advances.
    intro.update(dt, { keys, gestureFresh: !!(gestureMsg && t - gestureRecvAt < 0.5), gesture: gestureMsg });
    if (intro.state.phase === 'done') { finishIntro(); requestAnimationFrame(frame); return; }
    heroVel = { x: 0, z: 0 };
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const centerX = (cfg.room.minX + cfg.room.maxX) / 2, centerZ = (cfg.room.minZ + cfg.room.maxZ) / 2;
    drawMazeFlat(ctx, { state: mazeState, centerX, centerZ, X, Z, S });
    drawIntro(ctx, canvas, intro.state, { sprite: heroSprite, heroX: X(centerX + mazeState.hero.x), heroY: Z(centerZ + mazeState.hero.z) });
    introUI.update({ gestureFresh: !!(gestureMsg && t - gestureRecvAt < 0.5) });
    requestAnimationFrame(frame); return;
  }
  const mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), mz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  const mlen = Math.hypot(mx, mz);
  if (mlen > 1e-6) lastMoveDir = { x: mx / mlen, z: mz / mlen };
  const gestureFresh = gestureMsg && (t - gestureRecvAt) < 0.5;
  const gTarget = gestureTargetVel(t);
  let targetVel = gTarget && mlen < 1e-6 ? { x: gTarget.x * heroSpeed, z: gTarget.z * heroSpeed } : { x: mx * heroSpeed, z: mz * heroSpeed };
  const physical = isPhysicalBoss();
  const tracking = roverPreview ? previewState : roverTelemetry;
  const trackingAt = roverPreview ? previewAt : roverTelemetryAt;
  const trackingFresh = tracking?.valid && tracking?.pose && t-trackingAt<.25 && tracking.frame_age_ms<=250;
  if (physical) {
    const eligible=roverPreview ? physicalState.started && !physicalState.paused && !document.hidden : roverEligible({physicalBoss:true, started:physicalState.started, terminal:physicalState.terminal,
      paused:physicalState.paused, visible:!document.hidden, projectionInvalid,
      projectionSize:[canvas.width,canvas.height]},roverCalibration);
    if (!physicalState.terminal) {
      physicalState.phase=eligible && trackingFresh && (roverPreview || roverTelemetry?.armed) ? 'playing' : 'waiting';
      physicalState.message= roverPreview ? (physicalState.phase==='playing' ? 'LEVEL 3 · Camera preview · motors OFF' : 'PREVIEW · Show all 5 tags · B start / P resume') : !roverCalibration ? 'Calibrate rover and projection first' :
        projectionInvalid ? 'Projection changed — recalibrate and reload' :
        !eligible ? 'Paused / projection size mismatch — P to resume after setup' :
        physicalState.phase==='playing' ? 'Physical rover pursuing' : 'Place tagged rover; g + Enter in rover terminal to arm';
    }
    if(physicalState.phase!=='playing') {targetVel={x:0,z:0};heroVel={x:0,z:0};}
  }
  const isMaze = currentLevel().mode === 'maze';
  const isL2 = currentLevel().mode === 'l2';
  const isTK = currentLevel().mode === 'tk';
  if (isL2) { FLOOR.cx = l2State.state.floor.cx; FLOOR.cz = l2State.state.floor.cz; FLOOR.rx = l2State.state.floor.rx; FLOOR.rz = l2State.state.floor.rz; }
  const mazeCenterX = (cfg.room.minX + cfg.room.maxX) / 2, mazeCenterZ = (cfg.room.minZ + cfg.room.maxZ) / 2;
  const prevHeroX = hero.position.x, prevHeroZ = hero.position.z;
  if (isMaze) {
    easeVelocity(targetVel, dt);
    const handActive = mlen > 1e-6 || !!(gestureFresh && gestureMsg && gestureMsg.active);
    mazeState.heroR = HERO_R;
    mazeStep(mazeState, dt, { vx: heroVel.x, vz: heroVel.z, handActive });
    hero.position.x = mazeCenterX + mazeState.hero.x; hero.position.z = mazeCenterZ + mazeState.hero.z;
  } else if (isL2 && (l2Calibrating || l2State.state.phase !== 'PLAYING')) {
    heroVel = { x: 0, z: 0 }; // freeze on the death / victory card
  } else {
    if (!physical && !isL2 && t < ctl.state.dashUntil) {
      hero.position.x += dashDir.x * heroSpeed * 3 * dt; hero.position.z += dashDir.z * heroSpeed * 3 * dt;
      heroVel = { x: 0, z: 0 }; // so movement eases back in fresh once the dash ends
    } else {
      easeVelocity(targetVel, dt);
      hero.position.x += heroVel.x * dt; hero.position.z += heroVel.z * dt;
    }
    clampToArena(hero.position);
    if (!physical) clampToEllipse(hero.position);
    clampOutsidePillars(hero.position);
  }
  const moveDx = hero.position.x - prevHeroX, moveDz = hero.position.z - prevHeroZ;
  if (Math.hypot(moveDx, moveDz) > 1e-4) { // else hold the last facing angle
    heroFacingAngle = lerpAngle(heroFacingAngle, Math.atan2(moveDz, moveDx), 1 - Math.exp(-dt / 0.12));
  }
  let f;
  if (physical) {
    const arena=roverPreview ? boardArena : (roverCalibration?.arena??boardArena);
    const player=toBoardPlayer(hero,cfg.room,arena,HERO_R);
    roverShots.update(t,{active:physicalState.phase==='playing',boss:trackingFresh?{x:tracking.pose.x_mm,y:tracking.pose.y_mm}:null,
      player:{x:player.x_mm,y:player.y_mm,radius:player.radius_mm},
      velocity:{x:dt?moveDx/dt*arena.width_mm/(cfg.room.maxX-cfg.room.minX):0,y:dt?moveDz/dt*arena.height_mm/(cfg.room.maxZ-cfg.room.minZ):0},shield:t<shieldUntil});
    if(roverShots.state.phase==='defeat' && !physicalState.terminal)endPhysicalLevel('defeat');
    if(roverShots.state.phase==='victory' && !physicalState.terminal)endPhysicalLevel('victory');
    f = physicalState;
  } else if (isMaze) {
    f = mazeState; // .phase: PLAYING/CLEARED -- CLEARED is this level's "victory"
  } else if (isL2) {
    if (!l2Calibrating) l2State.update(t, dt);
    f = l2State.state; // .phase: IDLE/PLAYING/DEAD/CLEARED -- CLEARED is "victory"
  } else if (isTK) {
    tkBoss.update(t, dt); f = tkBoss.state;
  } else {
    ctl.update(t); f = ctl.state;
    if (f.phase === 'warning' && prevPhase !== 'warning') { pendingMode = currentLevel().bossMode; pendingPredictedDir = predictor.predict().dir; }
  }
  const won = (isMaze || isL2) ? f.phase === 'CLEARED' : f.phase === 'victory';
  const lost = !isMaze && !isL2 && f.phase === 'defeat';
  if ((won || lost) && prevPhase !== f.phase) transitionAt = t + TRANSITION_DELAY;
  if (transitionAt !== null && t >= transitionAt) {
    transitionAt = null;
    if (won) {
      if (isMaze) console.log(`[${currentLevel().name}] complete in ${f.elapsed.toFixed(2)}s, ${f.stars} stars`);
      if (isL2) console.log(`[${currentLevel().name}] complete in ${f.elapsed.toFixed(2)}s, ${f.deaths} deaths`);
      if (levelIndex < LEVELS.length - 1) { loadLevel(levelIndex + 1); startCurrentLevel(t); requestAnimationFrame(frame); return; } else allCleared = true;
    } else if (lost && !physical) { loadLevel(levelIndex); startCurrentLevel(t); }
  }
  publishRover();
  prevPhase = f.phase;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!isMaze) {
    const mapImg = mapImages[levelIndex];
    if (mapImg.complete && mapImg.naturalWidth > 0) {
      ctx.drawImage(mapImg, X(cfg.room.minX), Z(cfg.room.minZ), X(cfg.room.maxX) - X(cfg.room.minX), Z(cfg.room.maxZ) - Z(cfg.room.minZ));
    }
  }
  if (isTK) drawTKArena(ctx, canvas, f, t);
  if (SHOW_BORDER || physical) {
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3;
    ctx.strokeRect(X(cfg.room.minX), Z(cfg.room.minZ), X(cfg.room.maxX) - X(cfg.room.minX), Z(cfg.room.maxZ) - Z(cfg.room.minZ));
  }
  if (isMaze) {
    drawMazeFlat(ctx, { state: mazeState, centerX: mazeCenterX, centerZ: mazeCenterZ, X, Z, S });
  }
  if (!physical && !isMaze && !isL2 && !isTK && (f.phase === 'warning' || f.phase === 'laser')) {
    const a = Math.atan2(f.aim.z, f.aim.x);
    ctx.fillStyle = f.phase === 'laser' ? 'rgba(255,30,0,.85)' : 'rgba(255,140,0,.45)';
    ctx.beginPath(); ctx.moveTo(X(f.boss.x), Z(f.boss.z));
    ctx.arc(X(f.boss.x), Z(f.boss.z), cfg.range * S, a - cfg.halfAngle, a + cfg.halfAngle); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 14; ctx.strokeStyle = f.phase === 'laser' ? '#fff' : '#ff0'; ctx.stroke();
  }
  if (!physical && !isMaze && !isL2 && !isTK) { ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(X(f.boss.x), Z(f.boss.z), BOSS_PX, 0, 7); ctx.fill(); }
  if (isL2) drawHunters(ctx, f, { X, Z, S, t });
  if (isTK) drawTKBoss(ctx, f, { X, Z, S, t, sprite: tkSprite });
  if (physical) {
    const arena=roverPreview?boardArena:(roverCalibration?.arena??boardArena);
    const bx=x=>X(cfg.room.minX+(x-arena.x_mm)/arena.width_mm*(cfg.room.maxX-cfg.room.minX));
    const by=y=>Z(cfg.room.minZ+(y-arena.y_mm)/arena.height_mm*(cfg.room.maxZ-cfg.room.minZ));
    ctx.save();
    if(trackingFresh) {
      const pose=tracking.pose;
      ctx.strokeStyle='#70f0e4';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(bx(pose.x_mm),by(pose.y_mm),18,0,Math.PI*2);ctx.stroke();
      if(roverShots.state.phase==='warning' && roverShots.state.target) {
        ctx.setLineDash([8,8]);ctx.strokeStyle='#ffc56b';ctx.beginPath();
        ctx.moveTo(bx(pose.x_mm),by(pose.y_mm));ctx.lineTo(bx(roverShots.state.target.x),by(roverShots.state.target.y));ctx.stroke();ctx.setLineDash([]);
      }
    }
    for(const b of roverShots.state.bullets) {
      ctx.fillStyle='#ff7850';ctx.shadowColor='#ff4d26';ctx.shadowBlur=15;
      ctx.beginPath();ctx.arc(bx(b.x),by(b.y),b.radius*canvas.width/arena.width_mm,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  const heroSX = X(hero.position.x), heroSY = Z(hero.position.z);
  const shieldActive = physical ? t < shieldUntil : !isL2 && t < ctl.state.shieldUntil; // shield/dash are hero abilities, independent of the current level's mode
  if(physical && shieldActive) {ctx.strokeStyle='#79edff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(heroSX,heroSY,HERO_PX+5,0,Math.PI*2);ctx.stroke();}
  if (heroSprite.complete && heroSprite.naturalWidth > 0) {
    const spriteW = HERO_PX * 2, spriteH = spriteW * (heroSprite.naturalHeight / heroSprite.naturalWidth);
    ctx.save();
    ctx.translate(heroSX, heroSY);
    ctx.rotate(heroFacingAngle + Math.PI / 2); // + PI/2: sprite's zero-rotation pose already faces "up" (-PI/2)
    ctx.filter = 'hue-rotate(22deg) saturate(1.25) brightness(0.92) contrast(1.06)'; // mint-green body with retained shading and cream horns
    ctx.drawImage(heroSprite, -spriteW / 2, -spriteH / 2, spriteW, spriteH);
    ctx.filter = 'none';
    drawLennyEyes(ctx, spriteW, spriteH, t);
    ctx.restore();
  } else {
    ctx.fillStyle = shieldActive ? '#00ccff' : '#00ff66'; ctx.beginPath(); ctx.arc(heroSX, heroSY, HERO_PX, 0, 7); ctx.fill();
  }
  if (showDebugOverlay) { // the hit circle itself: same style as before, just gated behind O
    ctx.fillStyle = shieldActive ? '#00ccff' : '#00ff66'; ctx.beginPath(); ctx.arc(heroSX, heroSY, HERO_PX, 0, 7); ctx.fill();
  }
  const gStats = gesturePacketStats(t);
  if (physical) {
    ctx.fillStyle='rgba(10,12,20,.75)';ctx.fillRect(0,0,canvas.width,80);
    ctx.fillStyle='#fff';ctx.font='16px monospace';
    ctx.fillText(physicalState.message,10,22,canvas.width-20);
    ctx.fillText('HP '+roverShots.state.playerHP+' · Boss '+roverShots.state.bossHP+'/3 · Hand '+(gestureFresh ? gestureMsg.status : 'LOST')+' · WASD backup',10,46,canvas.width-20);
    ctx.fillText(roverPreview ? 'Approximate position · align the full border to the board' : 'Projection pixels: '+canvas.width+' x '+canvas.height,10,70,canvas.width-20);
  } else if (!isMaze && !isL2 && !isTK) { // other levels keep their always-on HUD; the maze stays a clean projection unless H is pressed
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    const p = predictor.predict();
    ctx.fillText(`Level ${levelIndex + 1}: ${currentLevel().name} | ${f.message} | player ${f.playerHP} boss ${f.bossHP}/3 | mode ${currentLevel().bossMode}`, 10, 20);
    ctx.fillText(`predicts ${p.dir} ${(p.confidence * 100).toFixed(0)}% (n=${p.n})`, 10, 40);
    ctx.fillText(`gesture: ${gestureMsg ? gestureMsg.status : 'none'} | link: ${gestureFresh ? 'OK' : 'LOST'}`, 10, 60);
    ctx.fillText(`packets/s: ${gStats.pps} | longest gap (2s): ${gStats.maxGapMs}ms`, 10, 80);
    ctx.fillText(`[ / ] warning: ${cfg.warning.toFixed(1)}s | - / = speed: ${heroSpeed.toFixed(2)}`, 10, 100);
    const dashCd = Math.max(0, Math.min(1, (ctl.state.dashReadyAt - t) / 1.5));
    ctx.fillStyle = '#333'; ctx.fillRect(10, 108, 100, 8);
    ctx.fillStyle = dashCd > 0 ? '#666' : '#9f6'; ctx.fillRect(10, 108, 100 * (1 - dashCd), 8);
  }
  if (allCleared) { ctx.fillStyle = '#ff0'; ctx.font = '14px monospace'; ctx.fillText('ALL LEVELS CLEARED - press B to play again', 10, 128); }
  if (isMaze && showLevelHUD) drawMazeHUD(ctx, mazeState, { levelName: currentLevel().name, heroSpeed, pps: gStats.pps });
  if (isMaze && f.phase === 'CLEARED') drawClearScreen(ctx, canvas, mazeState);
  if (isL2) {
    drawHuntHUD(ctx, canvas, f, { t, calibrating: l2Calibrating });
    if (showLevelHUD) {
      ctx.save(); ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
      ctx.fillText(`deaths: ${f.deaths} | gesture: ${gestureFresh ? 'OK' : 'LOST'} | R retry · T calibrate · H hide`, 16, canvas.height - 14);
      ctx.restore();
    }
  }
  if (isTK) drawTKHUD(ctx, canvas, f, t);
  if (showDebugOverlay) {
    ctx.strokeStyle = '#f0f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(X(FLOOR.cx), Z(FLOOR.cz), FLOOR.rx * S, FLOOR.rz * S, 0, 0, 7); ctx.stroke();
    if (currentLevel().pillars) for (const c of PILLARS) { ctx.beginPath(); ctx.arc(X(c.cx), Z(c.cz), c.r * S, 0, 7); ctx.stroke(); }
    if (isL2) for (const hunter of f.hunters) { ctx.beginPath(); ctx.arc(X(hunter.position.x), Z(hunter.position.z), hunter.radius * S, 0, 7); ctx.stroke(); }
  }
  requestAnimationFrame(frame);
})();
