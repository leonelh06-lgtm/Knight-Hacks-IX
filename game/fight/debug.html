<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}</style>
<canvas id="c" style="background:#111;display:block"></canvas>
<script type="module">
import { createFight } from './fight.js';
import { DodgePredictor } from './predictor.mjs';
import { makeAdaptive, makeRandomShift, withEscapeCheck } from './aim.mjs';
import { LEVELS } from './levels.mjs';
import { createMaze, step as mazeStep } from './maze.mjs';
import { drawMazeFlat, drawMazeHUD, drawClearScreen } from './maze_view.mjs';
const cfg = { position: { x: 0, z: 0 }, halfAngle: 0.35, range: 7, counter: 0.5, warning: 1.0,
              room: { minX: 0, maxX: 0, minZ: -1, maxZ: 9 } }; // minX/maxX set by resizeCanvas()
const SHOW_BORDER = false;
const FLOOR = { cx: 0, cz: 0, rx: 0, rz: 0 }; // computed as fractions of the arena rect in resizeCanvas(), tune via O overlay
const PILLARS = [ // solid obstacles, levels with pillars: true, tune via O overlay
  { cx: -1.8, cz: 3, r: 0.6 }, { cx: 1.8, cz: 3, r: 0.6 },
  { cx: -1.8, cz: 6, r: 0.6 }, { cx: 1.8, cz: 6, r: 0.6 },
];
const mapImages = LEVELS.map((lvl) => { const img = new Image(); img.src = lvl.map; return img; });
const heroSprite = new Image(); heroSprite.src = 'assets/dragon_hero.png'; // top-down, snout faces up (angle -PI/2)
let showDebugOverlay = false;
let heroSpeed = 3; // tunable with -/=, reset to the level's base speed whenever a level loads
const hero = { position: { x: 0, z: 5 } }, predictor = new DodgePredictor();
const chooseFns = { 'random-shift': makeRandomShift(), adaptive: makeAdaptive(predictor) };
let levelIndex = 0, allCleared = false, transitionAt = null;
const TRANSITION_DELAY = 2.5; // seconds the victory/defeat message holds before auto-advancing
function currentLevel() { return LEVELS[levelIndex]; }

// --- Hedge Maze state (Level 1). maze.mjs is purely local-coordinate, (0,0)
// at the maze's own center; debug.html centers that in the arena rectangle
// (the same bounds clampToArena uses) and owns the mirrored/HUD toggles.
let mazeMirrored = false; // toggled by Y ("swaps start and goal sides")
let showMazeHUD = false; // toggled by H
let mazeState = null; // created once resizeCanvas() has given cfg.room real dimensions
function makeMazeState() {
  const lvl = LEVELS[0]; // the only 'maze' level today
  const roomW = cfg.room.maxX - cfg.room.minX, roomH = cfg.room.maxZ - cfg.room.minZ;
  const s = createMaze({
    roomW, roomH, heroSpeed: lvl.heroSpeed, laneAssist: lvl.laneAssist,
    wallT: lvl.wallT, starThresholds: lvl.starThresholds, mirrored: mazeMirrored,
  });
  s.heroR = HERO_R;
  for (const w of s.geom.warnings) console.warn(`[${lvl.name}] ${w}`);
  return s;
}
function restartMaze() { mazeState = makeMazeState(); }

function loadLevel(i) {
  levelIndex = Math.max(0, Math.min(LEVELS.length - 1, i));
  const lvl = currentLevel();
  heroSpeed = lvl.heroSpeed;
  if (lvl.mode === 'boss') cfg.warning = lvl.warning;
  if (lvl.mode === 'maze' && mazeState) restartMaze(); // re-entering: fresh run, same mirror state
}
loadLevel(0);
const attackLog = [];
let pendingMode = currentLevel().bossMode, pendingPredictedDir = 'STAY', prevPhase = 'idle';
const ctl = createFight(cfg, hero, {
  chooseAim: (b, p) => withEscapeCheck(chooseFns[currentLevel().bossMode], {
    halfAngle: cfg.halfAngle, range: cfg.range, floor: FLOOR,
    pillars: currentLevel().pillars ? PILLARS : [], heroR: HERO_R, reach: heroSpeed * cfg.warning,
  })(b, p),
  onResolve: (e) => {
    const actualDir = predictor.observe({ x: e.p0.x, y: e.p0.z }, { x: e.p1.x, y: e.p1.z }, { x: e.aim.x, y: e.aim.z });
    console.log(JSON.stringify(e));
    attackLog.push({ t: e.t, mode: pendingMode, predictedDir: pendingPredictedDir, actualDir, hit: e.hit });
  },
});
function startCurrentLevel(atTime) {
  if (currentLevel().mode === 'maze') restartMaze(); else ctl.start(atTime);
}
const keys = {}, now = () => performance.now() / 1000;
let lastMoveDir = { x: 0, z: 0 }, dashDir = { x: 0, z: 1 };
let lastGestureDir = { x: 0, z: 0 }, gestureMsg = null, gestureRecvAt = -1e9;
let lastNonzeroGestureVel = { x: 0, z: 0 }, gestureZeroSinceT = null; // bridges stop/unclear packets for 150ms
let gesturePacketTimes = []; // for packets/sec + longest-gap HUD readout
let ws = null;
function connectGestureWS() {
  ws = new WebSocket('ws://localhost:8765');
  ws.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (!Number.isFinite(m.vx) || !Number.isFinite(m.vy)) return;
    gestureMsg = m; gestureRecvAt = now();
    gesturePacketTimes.push(gestureRecvAt);
    const glen = Math.hypot(m.vx, m.vy);
    if (glen > 1e-6) {
      lastGestureDir = { x: m.vx / glen, z: m.vy / glen };
      lastNonzeroGestureVel = { x: m.vx, z: m.vy };
      gestureZeroSinceT = null;
    } else if (gestureZeroSinceT === null) {
      gestureZeroSinceT = gestureRecvAt; // first stop/unclear packet in this streak
    }
  });
  ws.addEventListener('close', () => setTimeout(connectGestureWS, 500));
  ws.addEventListener('error', () => ws.close());
}
connectGestureWS();
addEventListener('keydown', (e) => { keys[e.code] = true;
  if (e.code === 'KeyB') { if (allCleared) { loadLevel(0); allCleared = false; } startCurrentLevel(now()); }
  if (e.code === 'KeyR') { if (currentLevel().mode === 'maze') restartMaze(); else ctl.reset(); }
  if (e.code === 'Space') { e.preventDefault(); ctl.shield(now()); }
  if (e.code === 'Digit1') { loadLevel(0); startCurrentLevel(now()); }
  if (e.code === 'Digit2') { loadLevel(1); startCurrentLevel(now()); }
  if (e.code === 'Digit3') { loadLevel(2); startCurrentLevel(now()); }
  if (e.code === 'KeyN') { loadLevel(Math.min(levelIndex + 1, LEVELS.length - 1)); startCurrentLevel(now()); } // testing: skip ahead
  if (e.code === 'KeyY' && currentLevel().mode === 'maze') { mazeMirrored = !mazeMirrored; restartMaze(); }
  if (e.code === 'KeyO') showDebugOverlay = !showDebugOverlay;
  if (e.code === 'KeyH') showMazeHUD = !showMazeHUD;
  if (e.code === 'BracketLeft') cfg.warning = Math.max(0.1, +(cfg.warning - 0.1).toFixed(2));
  if (e.code === 'BracketRight') cfg.warning = +(cfg.warning + 0.1).toFixed(2);
  if (e.code === 'Minus') heroSpeed = +(heroSpeed * 0.9).toFixed(3);
  if (e.code === 'Equal') heroSpeed = +(heroSpeed * 1.1).toFixed(3);
  if (e.code === 'KeyL') {
    const header = 't,mode,predictedDir,actualDir,hit';
    const rows = attackLog.map((r) => `${r.t},${r.mode},${r.predictedDir},${r.actualDir},${r.hit}`);
    const blob = new Blob([[header, ...rows].join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'attack_log.csv'; a.click();
    URL.revokeObjectURL(url);
  }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    const before = ctl.state.dashUntil; ctl.dash(now());
    if (ctl.state.dashUntil !== before) {
      const glen = Math.hypot(lastGestureDir.x, lastGestureDir.z);
      if (glen > 1e-6) dashDir = { x: lastGestureDir.x / glen, z: lastGestureDir.z / glen };
      else {
        const len = Math.hypot(lastMoveDir.x, lastMoveDir.z);
        if (len > 1e-6) dashDir = { x: lastMoveDir.x / len, z: lastMoveDir.z / len };
        else { const dx = hero.position.x - ctl.state.boss.x, dz = hero.position.z - ctl.state.boss.z, d = Math.hypot(dx, dz) || 1;
          dashDir = { x: dx / d, z: dz / d }; }
      }
    }
  } });
addEventListener('keyup', (e) => (keys[e.code] = false));
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const HERO_PX = 30, BOSS_PX = 45; // on-screen radii in pixels, fixed regardless of window size
let S, OX, OY, HERO_R;
const X = (x) => OX + x * S, Z = (z) => OY + z * S; let last = now();
function resizeCanvas() {
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const roomWidth = 10 * (canvas.width / canvas.height); // room height fixed at 10, width follows aspect ratio
  cfg.room.minX = -roomWidth / 2; cfg.room.maxX = roomWidth / 2;
  S = canvas.height / 10; OX = canvas.width / 2; OY = -cfg.room.minZ * S;
  HERO_R = HERO_PX / S;
  const roomHeight = cfg.room.maxZ - cfg.room.minZ;
  FLOOR.cx = (cfg.room.minX + cfg.room.maxX) / 2;
  FLOOR.cz = cfg.room.minZ + 0.55 * roomHeight;
  FLOOR.rx = 0.87 * roomWidth / 2;
  FLOOR.rz = 0.67 * roomHeight / 2;
  if (mazeState) restartMaze(); // the maze's pitch/geometry depends on room size
}
addEventListener('resize', resizeCanvas);
resizeCanvas();
mazeState = makeMazeState(); // first creation, now that cfg.room has real dimensions
function clampToArena(p) {
  p.x = Math.min(cfg.room.maxX - HERO_R, Math.max(cfg.room.minX + HERO_R, p.x));
  p.z = Math.min(cfg.room.maxZ - HERO_R, Math.max(cfg.room.minZ + HERO_R, p.z));
}
function clampToEllipse(p) {
  const rx = Math.max(1e-6, FLOOR.rx - HERO_R), rz = Math.max(1e-6, FLOOR.rz - HERO_R);
  const dx = (p.x - FLOOR.cx) / rx, dz = (p.z - FLOOR.cz) / rz, d = Math.hypot(dx, dz);
  if (d > 1) { p.x = FLOOR.cx + (dx / d) * rx; p.z = FLOOR.cz + (dz / d) * rz; }
}
function clampOutsidePillars(p) {
  if (!currentLevel().pillars) return;
  for (const c of PILLARS) {
    const dx = p.x - c.cx, dz = p.z - c.cz, dist = Math.hypot(dx, dz), minDist = c.r + HERO_R;
    if (dist < minDist) {
      const ang = dist > 1e-6 ? Math.atan2(dz, dx) : 0;
      p.x = c.cx + Math.cos(ang) * minDist; p.z = c.cz + Math.sin(ang) * minDist;
    }
  }
}
let heroVel = { x: 0, z: 0 };
let heroFacingAngle = -Math.PI / 2; // world-space atan2(dz,dx); -PI/2 matches the sprite's default "up" pose
function lerpAngle(cur, target, alpha) {
  const diff = ((target - cur + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
  return cur + diff * alpha;
}
function easeVelocity(target, dt) {
  const curMag = Math.hypot(heroVel.x, heroVel.z), targetMag = Math.hypot(target.x, target.z);
  const tau = targetMag > curMag ? 0.09 : 0.07; // ~90ms ease-in, ~70ms ease-out
  const alpha = 1 - Math.exp(-dt / tau);
  heroVel.x += (target.x - heroVel.x) * alpha;
  heroVel.z += (target.z - heroVel.z) * alpha;
}
function gestureTargetVel(t) {
  if (!(gestureMsg && t - gestureRecvAt < 0.5)) return null; // link LOST: no gesture target at all
  if (gestureZeroSinceT === null) return lastNonzeroGestureVel; // currently moving
  if (t - gestureZeroSinceT < 0.15) return lastNonzeroGestureVel; // bridging a stop/unclear packet
  return { x: 0, z: 0 }; // bridge expired, truly stopped
}
function gesturePacketStats(t) {
  while (gesturePacketTimes.length && t - gesturePacketTimes[0] > 2) gesturePacketTimes.shift();
  const pps = gesturePacketTimes.filter((ts) => t - ts <= 1).length;
  let maxGap = 0;
  for (let i = 1; i < gesturePacketTimes.length; i++) maxGap = Math.max(maxGap, gesturePacketTimes[i] - gesturePacketTimes[i - 1]);
  if (gesturePacketTimes.length) maxGap = Math.max(maxGap, t - gesturePacketTimes[gesturePacketTimes.length - 1]);
  return { pps, maxGapMs: Math.round(maxGap * 1000) };
}
(function frame() {
  const t = now(), dt = t - last; last = t;
  const mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), mz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  const mlen = Math.hypot(mx, mz);
  if (mlen > 1e-6) lastMoveDir = { x: mx / mlen, z: mz / mlen };
  const gestureFresh = gestureMsg && (t - gestureRecvAt) < 0.5;
  const gTarget = gestureTargetVel(t);
  const targetVel = gTarget ? { x: gTarget.x * heroSpeed, z: gTarget.z * heroSpeed } : { x: mx * heroSpeed, z: mz * heroSpeed };
  const isMaze = currentLevel().mode === 'maze';
  const mazeCenterX = (cfg.room.minX + cfg.room.maxX) / 2, mazeCenterZ = (cfg.room.minZ + cfg.room.maxZ) / 2;
  const prevHeroX = hero.position.x, prevHeroZ = hero.position.z;
  if (isMaze) {
    easeVelocity(targetVel, dt);
    const handActive = !!(gestureFresh && gestureMsg && gestureMsg.active);
    mazeState.heroR = HERO_R;
    mazeStep(mazeState, dt, { vx: heroVel.x, vz: heroVel.z, handActive });
    hero.position.x = mazeCenterX + mazeState.hero.x; hero.position.z = mazeCenterZ + mazeState.hero.z;
  } else {
    if (t < ctl.state.dashUntil) {
      hero.position.x += dashDir.x * heroSpeed * 3 * dt; hero.position.z += dashDir.z * heroSpeed * 3 * dt;
      heroVel = { x: 0, z: 0 }; // so movement eases back in fresh once the dash ends
    } else {
      easeVelocity(targetVel, dt);
      hero.position.x += heroVel.x * dt; hero.position.z += heroVel.z * dt;
    }
    clampToArena(hero.position);
    clampToEllipse(hero.position);
    clampOutsidePillars(hero.position);
  }
  const moveDx = hero.position.x - prevHeroX, moveDz = hero.position.z - prevHeroZ;
  if (Math.hypot(moveDx, moveDz) > 1e-4) { // else hold the last facing angle
    heroFacingAngle = lerpAngle(heroFacingAngle, Math.atan2(moveDz, moveDx), 1 - Math.exp(-dt / 0.12));
  }
  let f;
  if (isMaze) {
    f = mazeState; // .phase: PLAYING/CLEARED -- CLEARED is this level's "victory"
  } else {
    ctl.update(t); f = ctl.state;
    if (f.phase === 'warning' && prevPhase !== 'warning') { pendingMode = currentLevel().bossMode; pendingPredictedDir = predictor.predict().dir; }
  }
  const won = isMaze ? f.phase === 'CLEARED' : f.phase === 'victory';
  const lost = !isMaze && f.phase === 'defeat';
  if ((won || lost) && prevPhase !== f.phase) transitionAt = t + TRANSITION_DELAY;
  if (transitionAt !== null && t >= transitionAt) {
    transitionAt = null;
    if (won) {
      if (isMaze) console.log(`[${currentLevel().name}] complete in ${f.elapsed.toFixed(2)}s, ${f.stars} stars`);
      if (levelIndex < LEVELS.length - 1) { loadLevel(levelIndex + 1); startCurrentLevel(t); } else allCleared = true;
    } else if (lost) { loadLevel(levelIndex); startCurrentLevel(t); }
  }
  prevPhase = f.phase;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!isMaze) {
    const mapImg = mapImages[levelIndex];
    if (mapImg.complete && mapImg.naturalWidth > 0) {
      ctx.drawImage(mapImg, X(cfg.room.minX), Z(cfg.room.minZ), X(cfg.room.maxX) - X(cfg.room.minX), Z(cfg.room.maxZ) - Z(cfg.room.minZ));
    }
  }
  if (SHOW_BORDER) {
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 3;
    ctx.strokeRect(X(cfg.room.minX), Z(cfg.room.minZ), X(cfg.room.maxX) - X(cfg.room.minX), Z(cfg.room.maxZ) - Z(cfg.room.minZ));
  }
  if (isMaze) {
    drawMazeFlat(ctx, { state: mazeState, centerX: mazeCenterX, centerZ: mazeCenterZ, X, Z, S });
  }
  if (!isMaze && (f.phase === 'warning' || f.phase === 'laser')) {
    const a = Math.atan2(f.aim.z, f.aim.x);
    ctx.fillStyle = f.phase === 'laser' ? 'rgba(255,30,0,.85)' : 'rgba(255,140,0,.45)';
    ctx.beginPath(); ctx.moveTo(X(f.boss.x), Z(f.boss.z));
    ctx.arc(X(f.boss.x), Z(f.boss.z), cfg.range * S, a - cfg.halfAngle, a + cfg.halfAngle); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 14; ctx.strokeStyle = f.phase === 'laser' ? '#fff' : '#ff0'; ctx.stroke();
  }
  if (!isMaze) { ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(X(f.boss.x), Z(f.boss.z), BOSS_PX, 0, 7); ctx.fill(); }
  const heroSX = X(hero.position.x), heroSY = Z(hero.position.z);
  const shieldActive = t < ctl.state.shieldUntil; // shield/dash are hero abilities, independent of the current level's mode
  if (heroSprite.complete && heroSprite.naturalWidth > 0) {
    const spriteW = HERO_PX * 2, spriteH = spriteW * (heroSprite.naturalHeight / heroSprite.naturalWidth);
    ctx.save();
    ctx.translate(heroSX, heroSY);
    ctx.rotate(heroFacingAngle + Math.PI / 2); // + PI/2: sprite's zero-rotation pose already faces "up" (-PI/2)
    ctx.filter = 'saturate(180%) brightness(1.05)'; // the source art is a pale green, punch it up a bit
    ctx.drawImage(heroSprite, -spriteW / 2, -spriteH / 2, spriteW, spriteH);
    ctx.filter = 'none';
    ctx.restore();
  } else {
    ctx.fillStyle = shieldActive ? '#00ccff' : '#00ff66'; ctx.beginPath(); ctx.arc(heroSX, heroSY, HERO_PX, 0, 7); ctx.fill();
  }
  if (showDebugOverlay) { // the hit circle itself: same style as before, just gated behind O
    ctx.fillStyle = shieldActive ? '#00ccff' : '#00ff66'; ctx.beginPath(); ctx.arc(heroSX, heroSY, HERO_PX, 0, 7); ctx.fill();
  }
  const gStats = gesturePacketStats(t);
  if (!isMaze) { // other levels keep their always-on HUD; the maze stays a clean projection unless H is pressed
    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
    const p = predictor.predict();
    ctx.fillText(`Level ${levelIndex + 1}: ${currentLevel().name} | ${f.message} | player ${f.playerHP} boss ${f.bossHP}/3 | mode ${currentLevel().bossMode}`, 10, 20);
    ctx.fillText(`predicts ${p.dir} ${(p.confidence * 100).toFixed(0)}% (n=${p.n})`, 10, 40);
    ctx.fillText(`gesture: ${gestureMsg ? gestureMsg.status : 'none'} | link: ${gestureFresh ? 'OK' : 'LOST'}`, 10, 60);
    ctx.fillText(`packets/s: ${gStats.pps} | longest gap (2s): ${gStats.maxGapMs}ms`, 10, 80);
    ctx.fillText(`[ / ] warning: ${cfg.warning.toFixed(1)}s | - / = speed: ${heroSpeed.toFixed(2)}`, 10, 100);
    const dashCd = Math.max(0, Math.min(1, (ctl.state.dashReadyAt - t) / 1.5));
    ctx.fillStyle = '#333'; ctx.fillRect(10, 108, 100, 8);
    ctx.fillStyle = dashCd > 0 ? '#666' : '#9f6'; ctx.fillRect(10, 108, 100 * (1 - dashCd), 8);
  }
  if (allCleared) { ctx.fillStyle = '#ff0'; ctx.font = '14px monospace'; ctx.fillText('ALL LEVELS CLEARED - press B to play again', 10, 128); }
  if (isMaze && showMazeHUD) drawMazeHUD(ctx, mazeState, { levelName: currentLevel().name, heroSpeed, pps: gStats.pps });
  if (isMaze && f.phase === 'CLEARED') drawClearScreen(ctx, canvas, mazeState);
  if (showDebugOverlay) {
    ctx.strokeStyle = '#f0f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(X(FLOOR.cx), Z(FLOOR.cz), FLOOR.rx * S, FLOOR.rz * S, 0, 0, 7); ctx.stroke();
    if (currentLevel().pillars) for (const c of PILLARS) { ctx.beginPath(); ctx.arc(X(c.cx), Z(c.cz), c.r * S, 0, 7); ctx.stroke(); }
  }
  requestAnimationFrame(frame);
})();
</script>
