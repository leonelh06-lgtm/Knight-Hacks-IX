[env:mcore]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
# Placeholder analog pin IDs let PlatformIO compile the unused MegaPi sources
# included in Makeblock's all-board library when targeting an Uno.
build_flags =
    -DA8=14
    -DA9=15
    -DA10=16
    -DA11=17
    -DA12=18
    -DA13=19
lib_deps =
    https://github.com/Makeblock-official/Makeblock-Libraries.git#21b20bbd55bbaaaae6ac14a4580d0a238c8bbd4d
